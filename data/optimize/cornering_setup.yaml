# Cornering setup optimisation example.
#   aerolap optimize data/optimize/cornering_setup.yaml
# Paths are relative to this file. Any numeric vehicle parameter can be a variable.
vehicle: ../vehicles/fsae_ev_aero.yaml

objective:
  type: lap_time                 # lap_time | endurance_time | skidpad_time | ay_max
  track: ../tracks/fsae_autocross_example.csv
  start: standing
  level: L4                      # optimise the passive setup (fixed high-downforce mode)

variables:
  - {path: suspension.front.arb_rate_Nm_per_deg, bounds: [0, 600]}
  - {path: suspension.rear.arb_rate_Nm_per_deg, bounds: [0, 600]}
  - {path: suspension.front.heave_spring_N_per_mm, bounds: [0, 120]}
  - {path: suspension.rear.heave_spring_N_per_mm, bounds: [0, 120]}
  - {path: suspension.front.static_ride_height_mm, bounds: [20, 50]}
  - {path: suspension.rear.static_ride_height_mm, bounds: [25, 60]}
  - {path: aero.cop_shift, bounds: [-0.06, 0.06]}

constraints:
  min_clearance_mm: 5            # floor must not touch at the braking / cornering limits
  max_roll_deg: 1.5
  understeer_index: [1.0, 1.3]   # front axle saturates first (stable), but not too much understeer
  ride_frequency_hz: [3.0, 5.5]
  check_speeds_kmh: [30, 50, 70, 90, 110]

method: powell                   # powell (local, fast) | differential_evolution (global)
max_evals: 250
coarse: true

# Imported from OptimumLap vehicle '4.0' (fsk2026_4.0.olveh) with 'aerolap import-vehicle'.
# Full model: OptimumLap mass / tyres / aero + emrax_228 motor model.
# Taken from the OptimumLap file:
#   mass -> mass.total_kg
#   weightdrivenwheel -> mass.weight_dist_front (= 1 - value)
#   tireradius -> tires.radius_mm
#   longfriction -> tires.mu_x (x gripfactor)
#   latfriction -> tires.mu_y (x gripfactor)
#   tirerollingdrag -> tires.rolling_resistance
#   liftcoefficient -> aero.cl (x aerofactor)
#   dragcoefficient -> aero.cd (x aerofactor)
#   frontarea -> aero.frontal_area_m2
#   airdensity -> environment.air_density_kg_m3
#   driveefficiency -> powertrain.efficiency
#   finaldriveratio -> powertrain.ev.reduction_ratio / ice.final_drive (x gear ratio)
#   revlimit -> powertrain.ev.max_rpm / ice.rev_limit_rpm
#   torquedata -> powertrain.ev.motor_torque_curve / ice.torque_curve (x powerfactor)
# ASSUMED - not in the OptimumLap file, copied from data/vehicles/fsae_ev_aero.yaml; replace with real values:
#   mass.cg_height_mm / unsprung / inertias
#   geometry
#   tires (other than mu, radius, rolling)
#   suspension
#   brakes
#   aero devices: geometry of the front wing / side wing / sidepods / rear wing (see aero:), drag_height_mm,
#   floor_width_mm
#   powertrain.ev motor settings (dc_voltage_V, motor, motor_cooling, motor_variant)
#   powertrain.ev power_limit_kW / efficiencies
#   battery
name: 4.0 (OptimumLap import, full model)
environment:
  air_density_kg_m3: 1.225
mass:
  total_kg: 310.0
  weight_dist_front: 0.5
  cg_height_mm: 270
  unsprung_front_kg: 15
  unsprung_rear_kg: 16
  pitch_inertia_kgm2: null
  roll_inertia_kgm2: null
geometry:
  wheelbase_mm: 1550
  track_front_mm: 1220
  track_rear_mm: 1190
tires:
  radius_mm: 232.0
  mu_x: 1.5
  mu_y: 1.5
  ref_load_N: 650
  load_sensitivity: 0.0
  min_mu_factor: 0.5
  vertical_rate_N_per_mm: 100
  peak_slip_deg: 6.5
  camber_optimum_deg: -1.2
  camber_sensitivity_per_deg2: 0.006
  rolling_resistance: 0.015
suspension:
  front:
    spring_rate_N_per_mm: 40
    motion_ratio: 1.0
    arb_rate_Nm_per_deg: 250
    heave_spring_N_per_mm: 40
    roll_center_mm: 30
    static_ride_height_mm: 35
    static_camber_deg: -1.8
    camber_gain_deg_per_mm: -0.025
    anti_dive: 0.15
    damping_ratio: 0.65
  rear:
    spring_rate_N_per_mm: 45
    motion_ratio: 1.0
    arb_rate_Nm_per_deg: 150
    heave_spring_N_per_mm: 30
    roll_center_mm: 50
    static_ride_height_mm: 45
    static_camber_deg: -1.2
    camber_gain_deg_per_mm: -0.02
    anti_lift: 0.1
    anti_squat: 0.2
    damping_ratio: 0.65
brakes:
  bias_front: null
aero:
  # Bare car (chassis, wheels, driver: cla / cda below) + physics-based devices
  # (aerolap/aero/devices.py, multi-element wings: aerolap/aero/elements.py). Totals at the static
  # ride heights = OptimumLap file: ClA 0.997 m^2, CdA 0.470 m^2 (front / rear main aoa and the body
  # CdA fitted to it, front share 0.454 as before). ALL DEVICE GEOMETRY IS ASSUMED (typical FSAE
  # sizes) - replace with your design / CFD.
  # Angles: aoa_deg = main element to the car's horizontal; flap deflection_deg = flap to the MAIN
  # chord line (AERO_AUTOMATION convention); gap_mm / overlap_mm = slot to the element before it.
  # x_mm: centre of pressure behind the front axle (negative = ahead), wheelbase 1550 mm.
  # 'aerolap aero-split --detail' also optimises span, element chords, gaps, overlaps, height (ground
  # effect), x and the radiator core; put the real limits (rules box, packaging) in a device, e.g.
  #   detail_ranges: {span: [0.9, 1.1], main.chord: [150, 230], flap1.gap: [4, 10]}
  type: constant
  cla: 0.0
  cda: 0.2725
  cop_front: 0.5
  components:
    front:                  # front wing, 3 elements, in ground effect
      type: wing
      span_m: 1.0
      aoa_deg: 2.0          # design variable: main element
      range: [-4, 12]
      x_mm: -650
      height_mm: 80         # lowest point above ground at static ride height
      endplate_factor: 1.5
      elements:
        main:  {chord_mm: 175, airfoil: "4412"}
        flap1: {chord_mm: 80, deflection_deg: 15, gap_mm: 6, overlap_mm: 4, airfoil: "4412"}   # design variable
        flap2: {chord_mm: 60, deflection_deg: 35, gap_mm: 5, overlap_mm: 3, airfoil: "4412"}   # design variable
    side:                   # side wings (both sides together), 2 elements, out of ground effect
      type: wing
      span_m: 0.5
      aoa_deg: 2.0
      range: [-4, 12]
      x_mm: 700
      height_mm: 250
      endplate_factor: 1.3
      elements:
        main:  {chord_mm: 150, airfoil: "4412"}
        flap1: {chord_mm: 70, deflection_deg: 20, gap_mm: 5, overlap_mm: 3, airfoil: "4412"}
    sidepod:                # sidepods with the radiators (both sides): cooling drag vs heat rejection
      type: sidepod
      core_area_m2: 0.04    # radiator core
      exit_area_m2: 0.03    # design variable: outlet / louvre area
      loss_coefficient: 8.0 # core pressure loss K (core dynamic pressure)
      inlet_recovery: 0.9
      effectiveness: 0.5
      coolant_temp_C: 60
      heat_share: 0.85      # share of the powertrain losses that goes into the coolant
      body_cda: 0.05        # outer shape of the sidepods
      x_mm: 800
    rear:                   # rear wing, 3 elements, out of ground effect
      type: wing
      span_m: 1.0
      aoa_deg: 10.34        # design variable: main element
      range: [-4, 16]
      x_mm: 1800
      height_mm: 950
      endplate_factor: 1.8
      elements:
        main:  {chord_mm: 200, airfoil: "4412"}
        flap1: {chord_mm: 100, deflection_deg: 15, gap_mm: 7, overlap_mm: 4, airfoil: "4412"}
        flap2: {chord_mm: 70, deflection_deg: 35, gap_mm: 6, overlap_mm: 3, airfoil: "4412"}
  drag_height_mm: 520
  floor_width_mm: 900
  bottoming_clearance_mm: 5
powertrain:
  type: ev
  drive: rwd
  differential: lsd
  efficiency: 0.9
  ev:
    drivetrain_efficiency: 0.97
    inverter_efficiency: 0.97
    power_limit_kW: 80
    n_motors: 1
    motor: emrax_228
    motor_variant: MV
    motor_cooling: LC
    dc_voltage_V: 550.0        # ignored with the pack model (bus voltage from battery: at full power)
    reduction_ratio: 4.0
battery:
  # Cell-based pack model (aerolap/battery.py). ALL VALUES ASSUMED (21700 ~4 Ah high-power cell,
  # 132S4P = 7.6 kWh, 552 V full) - replace with the team's cell data sheet and pack layout.
  series: 132
  parallel: 4
  soc: 1.0                    # SOC at the start of the run
  soc_min: 0.05               # lowest usable SOC
  soc_stages: 3               # endurance is driven in this many SOC steps
  interconnect_resistance_mOhm: 30   # bus bars, fuse, AIRs
  max_current_A: null         # pack limit (fuse ...); null -> cell max x parallel
  cell:
    capacity_Ah: 4.0
    resistance_mOhm: 13       # DC internal resistance per cell
    max_current_A: 45         # max discharge current per cell
    v_min: 2.8
    ocv: [[0.0, 3.0], [0.1, 3.35], [0.2, 3.5], [0.5, 3.68], [0.8, 3.95], [1.0, 4.18]]   # [SOC, V]
  regen_power_kW: 0           # recuperation limit at the battery (0 = no regen)
  regen_axle_share: 0.35

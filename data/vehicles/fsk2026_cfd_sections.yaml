# !!! SYNTHETIC CFD EXAMPLE !!! Same car as fsk2026.yaml, but the front and rear wings use 2-D section
# results in the AERO_AUTOMATION summary.csv format (data/aero_sections/synthetic_*.csv). Those numbers
# are MADE UP for testing - point section_data to the real runs/summary.csv once Fluent has run.
# Static totals kept at the OptimumLap values (ClA 0.997, CdA 0.470) via the rear angle and body CdA.
# Imported from OptimumLap vehicle '4.0' (fsk2026_4.0.olveh) with 'aerolap import-vehicle'.
# Full model: OptimumLap mass / tyres / aero + emrax_228 motor model.
# Taken from the OptimumLap file:
#   mass -> mass.total_kg
#   weightdrivenwheel -> mass.weight_dist_front (= 1 - value)
#   tireradius -> tires.radius_mm
#   longfriction -> tires.mu_x (x gripfactor)
#   latfriction -> tires.mu_y (x gripfactor)
#   tirerollingdrag -> tires.rolling_resistance
#   liftcoefficient -> aero.cl (x aerofactor)
#   dragcoefficient -> aero.cd (x aerofactor)
#   frontarea -> aero.frontal_area_m2
#   airdensity -> environment.air_density_kg_m3
#   driveefficiency -> powertrain.efficiency
#   finaldriveratio -> powertrain.ev.reduction_ratio / ice.final_drive (x gear ratio)
#   revlimit -> powertrain.ev.max_rpm / ice.rev_limit_rpm
#   torquedata -> powertrain.ev.motor_torque_curve / ice.torque_curve (x powerfactor)
# ASSUMED - not in the OptimumLap file, copied from data/vehicles/fsae_ev_aero.yaml; replace with real values:
#   mass.cg_height_mm / unsprung / inertias
#   geometry
#   tires (other than mu, radius, rolling)
#   suspension
#   brakes
#   aero devices: geometry of the front wing / floor / rear wing (see aero:), drag_height_mm, floor_width_mm
#   powertrain.ev motor settings (dc_voltage_V, motor, motor_cooling, motor_variant)
#   powertrain.ev power_limit_kW / efficiencies
#   battery
name: 4.0 (OptimumLap import, full model)
environment:
  air_density_kg_m3: 1.225
mass:
  total_kg: 310.0
  weight_dist_front: 0.5
  cg_height_mm: 270
  unsprung_front_kg: 15
  unsprung_rear_kg: 16
  pitch_inertia_kgm2: null
  roll_inertia_kgm2: null
geometry:
  wheelbase_mm: 1550
  track_front_mm: 1220
  track_rear_mm: 1190
tires:
  radius_mm: 232.0
  mu_x: 1.5
  mu_y: 1.5
  ref_load_N: 650
  load_sensitivity: 0.0
  min_mu_factor: 0.5
  vertical_rate_N_per_mm: 100
  peak_slip_deg: 6.5
  camber_optimum_deg: -1.2
  camber_sensitivity_per_deg2: 0.006
  rolling_resistance: 0.015
suspension:
  front:
    spring_rate_N_per_mm: 40
    motion_ratio: 1.0
    arb_rate_Nm_per_deg: 250
    heave_spring_N_per_mm: 40
    roll_center_mm: 30
    static_ride_height_mm: 35
    static_camber_deg: -1.8
    camber_gain_deg_per_mm: -0.025
    anti_dive: 0.15
    damping_ratio: 0.65
  rear:
    spring_rate_N_per_mm: 45
    motion_ratio: 1.0
    arb_rate_Nm_per_deg: 150
    heave_spring_N_per_mm: 30
    roll_center_mm: 50
    static_ride_height_mm: 45
    static_camber_deg: -1.2
    camber_gain_deg_per_mm: -0.02
    anti_lift: 0.1
    anti_squat: 0.2
    damping_ratio: 0.65
brakes:
  bias_front: null
aero:
  # Bare car (chassis, wheels, driver: cla / cda below) + three physics-based devices
  # (aerolap/aero/devices.py). Totals at the static ride heights = OptimumLap file: ClA 0.997 m^2,
  # CdA 0.470 m^2. ALL DEVICE GEOMETRY IS ASSUMED (typical FSAE sizes) - replace with your design / CFD.
  # x_mm: centre of pressure behind the front axle (negative = ahead), wheelbase 1550 mm.
  type: constant
  cla: 0.0
  cda: 0.353
  cop_front: 0.5
  components:
    front:                  # front wing from 2-D section data (ground effect), SYNTHETIC
      type: wing
      section_data: ../aero_sections/synthetic_front_summary.csv
      section: {main_airfoil: 4412, flap1_chord: 80, flap1_deflection: 15, flap1_gap: 6}
      span_m: 1.0
      aoa_deg: 4.0          # design variable, same definition as the CFD aoa
      x_mm: -650
      height_mm: 80         # lowest point above ground at static ride height (CFD ground_clearance)
      endplate_factor: 1.5
    side:                   # undertray / diffuser / sidepods
      type: floor
      area_m2: 1.0
      cl_ref: 0.3396        # at height_mm (h_ref)
      height_mm: 40         # floor clearance at x_mm, static
      x_mm: 800
      height_exponent: 0.6  # ClA ~ (h_ref / h)^0.6
      stall_mm: 12          # flow chokes below this clearance
      rake_gain: 0.05       # +5 % per deg of extra rake
      cd_area: 0.04
      scale: 1.0            # design variable: floor / diffuser size
      range: [0.5, 1.6]
    rear:                   # rear wing from 2-D section data (free stream), SYNTHETIC
      type: wing
      section_data: ../aero_sections/synthetic_rear_summary.csv
      section: {case_set: 2el, main_airfoil: 4412, flap1_chord: 80}
      span_m: 1.0
      aoa_deg: 11.87
      x_mm: 1800
      height_mm: 950
      endplate_factor: 1.8
  drag_height_mm: 520
  floor_width_mm: 900
  bottoming_clearance_mm: 5
powertrain:
  type: ev
  drive: rwd
  differential: lsd
  efficiency: 0.9
  ev:
    drivetrain_efficiency: 0.97
    inverter_efficiency: 0.97
    power_limit_kW: 80
    n_motors: 1
    motor: emrax_228
    motor_variant: MV
    motor_cooling: LC
    dc_voltage_V: 550.0        # ignored with the pack model (bus voltage from battery: at full power)
    reduction_ratio: 4.0
battery:
  # Cell-based pack model (aerolap/battery.py). ALL VALUES ASSUMED (21700 ~4 Ah high-power cell,
  # 132S4P = 7.6 kWh, 552 V full) - replace with the team's cell data sheet and pack layout.
  series: 132
  parallel: 4
  soc: 1.0                    # SOC at the start of the run
  soc_min: 0.05               # lowest usable SOC
  soc_stages: 3               # endurance is driven in this many SOC steps
  interconnect_resistance_mOhm: 30   # bus bars, fuse, AIRs
  max_current_A: null         # pack limit (fuse ...); null -> cell max x parallel
  cell:
    capacity_Ah: 4.0
    resistance_mOhm: 13       # DC internal resistance per cell
    max_current_A: 45         # max discharge current per cell
    v_min: 2.8
    ocv: [[0.0, 3.0], [0.1, 3.35], [0.2, 3.5], [0.5, 3.68], [0.8, 3.95], [1.0, 4.18]]   # [SOC, V]
  regen_power_kW: 0           # recuperation limit at the battery (0 = no regen)
  regen_axle_share: 0.35
